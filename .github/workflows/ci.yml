name: CI

on:
  push:
    branches:
      - main
      - weekly
      - nightly
  pull_request:
    branches:
      - main
      - weekly
      - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: ns-marks-the-spot.xcodeproj
  SCHEME: ns-marks-the-spot
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

jobs:
  build-gate-tests:
    name: Build gate + tests
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Resolve cache key inputs
        id: cache-key
        run: |
          version="$(xcodebuild -version | tr '\n ' '--' | sed 's/-*$//')"
          echo "xcode-version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            DerivedData
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-

      - name: Validate promotion source
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            main:weekly|main:hotfix/*)
              ;;
            weekly:nightly|weekly:main)
              ;;
            nightly:*)
              ;;
            *)
              echo "::error::Promotion ladder violation: $HEAD_BRANCH cannot target $BASE_BRANCH."
              echo "::error::Use feature/* -> nightly -> weekly -> main, or hotfix/* -> main then back-merge main down."
              exit 1
              ;;
          esac

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests when simulator runtime is healthy
        run: |
          simulator_udid="$(
            xcrun simctl list devices available -j \
              | jq -r '[.devices | to_entries[] | .value[] | select(.isAvailable == true and (.name | test("^iPhone")))] | first | .udid // empty'
          )"

          if [ -z "$simulator_udid" ]; then
            echo "::notice::No available iOS simulator device was found. build-for-testing remains the required gate."
            exit 0
          fi

          xcrun simctl boot "$simulator_udid" || true
          if ! xcrun simctl bootstatus "$simulator_udid" -b; then
            echo "::notice::The iOS simulator runtime could not boot. build-for-testing remains the required gate."
            exit 0
          fi

          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:ns-marks-the-spotTests \
            CODE_SIGNING_ALLOWED=NO
