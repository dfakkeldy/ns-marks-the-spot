name: CI

on:
  push:
    branches:
      - main
      - weekly
      - nightly
  pull_request:
    branches:
      - main
      - weekly
      - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: ns-marks-the-spot.xcodeproj
  SCHEME: ns-marks-the-spot
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      web: ${{ steps.scope.outputs.web }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate promotion source
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            main:weekly|main:hotfix/*)
              ;;
            weekly:nightly|weekly:main)
              ;;
            nightly:*)
              ;;
            *)
              echo "::error::Promotion ladder violation: $HEAD_BRANCH cannot target $BASE_BRANCH."
              echo "::error::Use feature/* -> nightly -> weekly -> main, or hotfix/* -> main then back-merge main down."
              exit 1
              ;;
          esac

      - name: Test change classifier
        run: python3 -m unittest discover -s .github/scripts/tests -v

      # Pure-stdlib and fast. These guard the Church panel cutlines and
      # graticule maths, including the assertion that two panels can never
      # claim the same source pixel - the defect behind the rejected
      # 2026-07-24 georeferencing pilot.
      - name: Church map pipeline tests
        run: python3 -m unittest discover -s tools/church/tests -t .

      - name: Fletcher map pipeline tests
        run: python3 -m unittest discover -s tools/fletcher/tests -t .

      # The control CSVs are GENERATED from the committed detection artifacts.
      # Detection itself needs the 180 MB archival scan and OpenCV, but this
      # step does not, so CI can prove the checked-in control points still match
      # the linework they claim to come from - and catch a hand-edited CSV.
      - name: Church control points match their detections
        run: |
          for panel in north south; do
            python3 -m tools.church.emit_gcps inverness "$panel" \
            --out "tools/church/gcps/inverness-$panel.csv" --check
          done

      - name: Fletcher control points match their reviewed observations
        run: |
          for observation in tools/fletcher/observations/sheet-*.json; do
            sheet="$(basename "$observation" .json)"
            python3 -m tools.fletcher.emit_gcps "$observation" \
              --out "tools/fletcher/gcps/$sheet.csv" --check
          done

      - name: Fletcher physical controls and checks match the reviewed observation
        run: |
          if test -f tools/fletcher/physical_gcps/sheet-24-controls.csv; then
            python3 -m tools.fletcher.emit_physical_gcps \
              tools/fletcher/physical_observations/sheet-24.json \
              --controls tools/fletcher/physical_gcps/sheet-24-controls.csv \
              --checks tools/fletcher/physical_gcps/sheet-24-checks.csv \
              --check
          else
            python3 -m tools.fletcher.physical_observation validate \
              tools/fletcher/physical_observations/sheet-24.json \
              --require-rejected
          fi

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA"
          elif [ -z "$BEFORE_SHA" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            git diff-tree --no-commit-id --name-only -r -z "$AFTER_SHA"
          else
            git diff --name-only -z "$BEFORE_SHA" "$AFTER_SHA"
          fi | python3 .github/scripts/classify_ci_changes.py --github-output "$GITHUB_OUTPUT"

  web_app:
    name: Web tests + build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      # The tax-sale snapshots the app bundles are copies of the web's own
      # files. This compares all three copies, so a refreshed snapshot that
      # was never re-exported fails here instead of shipping an app that
      # quotes a withdrawn parcel as a current listing.
      - name: Shared datasets match the web's own copies
        run: npm run check:shared-data

      - name: Test web app
        run: npm test

      - name: Lint web app
        run: npm run lint

      - name: Build web app
        run: npm run build

  # NSMarksCore is the shared logic the app is built on: the layer catalog,
  # the GIS clients, the evidence contracts. It builds and tests without a
  # simulator, an app bundle, or code signing, so it finishes in seconds and
  # reports on its own rather than as one line inside a twenty-minute native
  # run. When both jobs fail, this one says whether the fault is in the shared
  # logic or only in the app around it.
  core_package:
    name: Core package tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Test core package
        run: swift test --package-path NSMarksCore

  native_app:
    name: Native build + tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Resolve cache key inputs
        id: cache-key
        run: |
          version="$(xcodebuild -version | tr '\n ' '--' | sed 's/-*$//')"
          echo "xcode-version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            DerivedData
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      # A runner with no iPhone simulator used to be treated as success, which
      # meant the required check could go green having run no tests at all.
      # Nothing downstream can tell that apart from a run that passed, so it
      # fails here instead.
      - name: Resolve test simulator
        id: test-simulator
        run: |
          destination="$(
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations |
            python3 .github/scripts/resolve-ios-test-destination.py || true
          )"

          if [ -z "$destination" ]; then
            echo "::error::No available iPhone simulator was found, so the unit and UI tests cannot run. A green check here would claim evidence this run does not have."
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations || true
            exit 1
          fi

          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Run unit and UI tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.test-simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:ns-marks-the-spotTests \
            -only-testing:ns-marks-the-spotUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/native-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # A test host that exits unexpectedly is reported as whichever test was
      # in flight, with no message and no crash report. The bundle carries both,
      # and without it a runner-only failure cannot be told from a real one.
      - name: Keep the result bundle when the tests failed
        if: failure() && steps.test-simulator.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: |
            ${{ runner.temp }}/native-tests.xcresult
            ~/Library/Logs/DiagnosticReports
          retention-days: 7
          if-no-files-found: ignore

  required_gate:
    name: Build gate + tests
    needs:
      - changes
      - core_package
      - native_app
      - web_app
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every affected product suite
        env:
          CHANGE_CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          NATIVE_RESULT: ${{ needs.native_app.result }}
          CORE_RESULT: ${{ needs.core_package.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web_app.result }}
        run: |
          if [ "$CHANGE_CLASSIFICATION_RESULT" != "success" ]; then
            echo "::error::Change classification failed: $CHANGE_CLASSIFICATION_RESULT"
            exit 1
          fi

          if [ "$WEB_REQUIRED" = "true" ] && [ "$WEB_RESULT" != "success" ]; then
            echo "::error::Required web suite did not pass: $WEB_RESULT"
            exit 1
          fi

          if [ "$NATIVE_REQUIRED" = "true" ] && [ "$CORE_RESULT" != "success" ]; then
            echo "::error::Required core package suite did not pass: $CORE_RESULT"
            exit 1
          fi

          if [ "$NATIVE_REQUIRED" = "true" ] && [ "$NATIVE_RESULT" != "success" ]; then
            echo "::error::Required native suite did not pass: $NATIVE_RESULT"
            exit 1
          fi

          echo "All affected product suites passed."
