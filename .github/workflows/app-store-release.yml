name: App Store Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild unchanged inputs intentionally, with all existing gates
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROJECT: ns-marks-the-spot.xcodeproj
  SCHEME: ns-marks-the-spot
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

concurrency:
  group: release-trains
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Compare delivered App Store build inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      source_sha: ${{ steps.changes.outputs.source_sha }}
      plan: ${{ steps.changes.outputs.plan }}
      fingerprint_ios: ${{ steps.changes.outputs.fingerprint_ios }}
    steps:
      - name: Inspect release source tree
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Check out delivery guard from controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: .github
      - name: Compare successful deliveries
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: >-
          python3 .release-control/.github/scripts/release_delivery.py plan
          --controller .release-control --workflow app-store-release.yml --job release
          --channel appstore --force "$FORCE_RELEASE"

  release:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    env:
      RELEASE_PLAN: ${{ needs.changes.outputs.plan }}
      RELEASE_CONTROL_SCRIPT: ${{ github.workspace }}/.release-control/.github/scripts/release_delivery.py
    name: Archive and upload App Store build
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Check out delivery recorder from controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: .github

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      # A runner with no iPhone simulator used to be treated as success,
      # which meant this gate could go green having run no tests at all.
      - name: Resolve test simulator
        id: test-simulator
        run: |
          destination="$(
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations |
            python3 .github/scripts/resolve-ios-test-destination.py || true
          )"

          if [ -z "$destination" ]; then
            echo "::error::No available iPhone simulator was found, so the unit and UI tests cannot run. A green check here would claim evidence this run does not have."
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations || true
            exit 1
          fi

          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Run release tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.test-simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:ns-marks-the-spotTests \
            -only-testing:ns-marks-the-spotUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure match SSH key
        env:
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
        run: |
          if [ -z "$MATCH_GIT_SSH_KEY" ]; then
            echo "::error::MATCH_GIT_SSH_KEY is required for App Store signing."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_GIT_SSH_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_key -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Upload App Store build
        id: delivery
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_JSON" ] || [ -z "$MATCH_PASSWORD" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_JSON and MATCH_PASSWORD are required for App Store release uploads."
            exit 1
          fi

          if grep -q "TODO" fastlane/Matchfile; then
            echo "::error::fastlane/Matchfile still contains TODO values, so this release cannot be signed."
            exit 1
          fi

          bundle exec fastlane release
          python3 "$RELEASE_CONTROL_SCRIPT" record --platform ios

      - name: Retain successful appstore ios delivery receipt
        if: success() && steps.delivery.outputs.ios_delivered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-delivery-v1-appstore-ios-${{ github.run_attempt }}-${{ needs.changes.outputs.fingerprint_ios }}
          path: ${{ runner.temp }}/release-receipts/ios.json
          retention-days: 90
          if-no-files-found: error
