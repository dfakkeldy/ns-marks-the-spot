# EXPERIMENT — not for merge (grok-bots#962). The harness from #686, now with
# the cancel-aware tap: three shards of 700 taps under disk load, plus controls
# with faults injected that show which losses the tap repeats and which it must
# leave visible.
name: "[experiment] cancel hunt"

on:
  push:
    branches:
      - experiment/cancel-aware-tap

permissions:
  contents: read

env:
  PROJECT: ns-marks-the-spot.xcodeproj
  SCHEME: ns-marks-the-spot
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

jobs:
  controls:
    name: "Controls and carrier probe"
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Resolve cache key inputs
        id: cache-key
        run: |
          version="$(xcodebuild -version | tr '\n ' '--' | sed 's/-*$//')"
          echo "xcode-version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM and DerivedData
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            DerivedData
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-

      - name: Resolve Swift packages
        run: xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Resolve test simulator
        id: test-simulator
        run: |
          destination="$(
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations |
            python3 .github/scripts/resolve-ios-test-destination.py
          )"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Controls, carrier probe and the fix's own tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.test-simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:ns-marks-the-spotTests/UITestTouchLedgerTests \
            -only-testing:ns-marks-the-spotUITests/SystemCancelRetryTests \
            -only-testing:ns-marks-the-spotUITests/TouchLedgerUITests \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZLedgerCarrierProbe \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlIgnoredTapIsNotRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlAppCancelIsNotRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlForcedSystemCancelIsRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlEarlyPressCancelIsRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlLatePressCancelIsRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlDelayedAppCancelReadings \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlDrawingEarlyCancelIsRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlDrawingLateCancelIsNotRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlAppCancelDuringADragIsNotRepeated \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlForcedCancelOnBaseMapRow \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZControlForcedCancelOnMoreRow \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/controls.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/controls.log"

      - name: Tally
        if: always()
        run: |
          grep -E 'CARRIER |LEDGER_INJECT|FINAL_LEDGER|UITEST_TAP|PRESS_CONTROL|DRAW_CONTROL|MENU_CONTROL|^Test Case .*(passed|failed)|error:' "$RUNNER_TEMP/controls.log" | cut -c1-400 || true
          awk '/PROBE_SUMMARY_BEGIN/,/PROBE_SUMMARY_END/' "$RUNNER_TEMP/controls.log" || true
          awk '/PRESS_TRACE_BEGIN/,/PRESS_TRACE_END/' "$RUNNER_TEMP/controls.log" | cut -c1-400 || true

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controls
          path: |
            ${{ runner.temp }}/controls.log
          retention-days: 7
          if-no-files-found: ignore

  hunt:
    name: "Cancel hunt shard ${{ matrix.shard }}"
    runs-on: macos-26
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Resolve cache key inputs
        id: cache-key
        run: |
          version="$(xcodebuild -version | tr '\n ' '--' | sed 's/-*$//')"
          echo "xcode-version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM and DerivedData
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            DerivedData
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-

      - name: Resolve Swift packages
        run: xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Resolve test simulator
        id: test-simulator
        run: |
          destination="$(
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations |
            python3 .github/scripts/resolve-ios-test-destination.py
          )"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Start disk load
        run: |
          cat > "$RUNNER_TEMP/io.sh" <<'EOF'
          while true; do
            dd if=/dev/urandom of="$RUNNER_TEMP/io.bin" bs=1m count=1024 2>/dev/null
            sync
            cat "$RUNNER_TEMP/io.bin" > /dev/null
            rm -f "$RUNNER_TEMP/io.bin"
          done
          EOF
          RUNNER_TEMP="$RUNNER_TEMP" nohup bash "$RUNNER_TEMP/io.sh" > /dev/null 2>&1 &
          sleep 10
          uptime

      - name: Cancel hunt
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.test-simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:ns-marks-the-spotUITests/MapTapProbeUITests/testZZCancelHunt \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/hunt.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/hunt.log"

      - name: Stop the load
        if: always()
        run: |
          pkill -f io.sh || true
          pkill dd || true
          uptime

      - name: Tally and dump the app's unified-log trace
        if: always()
        run: |
          awk '/PROBE_SUMMARY_BEGIN/,/PROBE_SUMMARY_END/' "$RUNNER_TEMP/hunt.log" || true
          awk '/PROBE_TRACE_BEGIN/,/PROBE_TRACE_END/' "$RUNNER_TEMP/hunt.log" || true
          grep -E 'UITEST_TAP|FINAL_LEDGER' "$RUNNER_TEMP/hunt.log" | cut -c1-400 || true
          udid="$(xcrun simctl list devices -j | python3 -I -c '
          import json, sys
          name, os_version = sys.argv[1], sys.argv[2]
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if runtime.endswith("iOS-" + os_version.replace(".", "-")):
                  for device in devices:
                      if device["name"] == name:
                          print(device["udid"])
          ' "$(echo '${{ steps.test-simulator.outputs.destination }}' | sed -E 's/.*name=([^,]+),.*/\1/')" \
            "$(echo '${{ steps.test-simulator.outputs.destination }}' | sed -E 's/.*OS=//')" | head -1)"
          xcrun simctl boot "$udid" || true
          xcrun simctl spawn "$udid" log show --style compact --last 6h \
            --predicate 'subsystem == "nsmts.maptaptrace"' > "$RUNNER_TEMP/trace-log.txt" 2>&1 || true
          echo "touches: began $(grep -c 'touch began' "$RUNNER_TEMP/trace-log.txt") ended $(grep -c 'touch ended' "$RUNNER_TEMP/trace-log.txt") cancelled $(grep -c 'touch cancelled' "$RUNNER_TEMP/trace-log.txt")"
          grep -B30 -A3 "touch cancelled" "$RUNNER_TEMP/trace-log.txt" | sed -E 's/^.*\[trace\] //' || true

      - name: Keep logs and the trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/hunt.log
            ${{ runner.temp }}/trace-log.txt
          retention-days: 7
          if-no-files-found: ignore
