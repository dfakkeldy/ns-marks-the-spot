# EXPERIMENT — not for merge (grok-bots#937). A long soak of the three flaky
# MapChromeUITests on hosted runners, four shards in parallel, with no
# retries. Every failure prints the app's trace (gesture decisions and every
# touch the process received); a watchdog records the app's CPU each second
# and samples its stacks whenever it spins, because each failed CI run was
# slow only inside the failing test's app instance.
name: "[experiment] map tap flakes"

on:
  push:
    branches:
      - experiment/map-tap-flakes-2

permissions:
  contents: read

env:
  PROJECT: ns-marks-the-spot.xcodeproj
  SCHEME: ns-marks-the-spot
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

jobs:
  soak:
    name: "Soak shard ${{ matrix.shard }}"
    runs-on: macos-26
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Resolve cache key inputs
        id: cache-key
        run: |
          version="$(xcodebuild -version | tr '\n ' '--' | sed 's/-*$//')"
          echo "xcode-version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM and DerivedData
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            DerivedData
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cache-key.outputs.xcode-version }}-

      - name: Resolve Swift packages
        run: xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Resolve test simulator
        id: test-simulator
        run: |
          destination="$(
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations |
            python3 .github/scripts/resolve-ios-test-destination.py
          )"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Start the CPU watchdog
        run: |
          nohup bash .github/experiment/watchdog.sh "$RUNNER_TEMP/watch" > /dev/null 2>&1 &
          sleep 2
          pgrep -f watchdog.sh

      - name: Flaky tests x60
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.test-simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:ns-marks-the-spotUITests/MapChromeUITests/testTappingTheMapClosesTheLayersPanel \
            -only-testing:ns-marks-the-spotUITests/MapChromeUITests/testMeasuringReportsADistanceForTapsOnTheMap \
            -only-testing:ns-marks-the-spotUITests/MapChromeUITests/testTheMapOpensOnTheAtlasAndTheCreditFollowsTheGround \
            -test-iterations 60 \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/iterations.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/iterations.log"

      - name: Tally
        if: always()
        run: |
          pkill -f watchdog.sh || true
          echo "ITERATIONS_BEGIN (shard ${{ matrix.shard }})"
          grep -E "^Test Case '-\[ns_marks_the_spotUITests\.MapChromeUITests test" "$RUNNER_TEMP/iterations.log" \
            | grep -E "(passed|failed) \(" \
            | sed -E "s/.*MapChromeUITests (test[A-Za-z]+)\]' (passed|failed).*/\1 \2/" | sort | uniq -c || true
          grep -E "error: -\[" "$RUNNER_TEMP/iterations.log" | sed -E 's/.*\] : //' | sort | uniq -c || true
          echo "ITERATIONS_END"
          echo "CPU_HOT_SECONDS (>=85%): $(awk '$3+0 >= 85' "$RUNNER_TEMP/watch/cpu.log" | wc -l) of $(wc -l < "$RUNNER_TEMP/watch/cpu.log")"
          ls -la "$RUNNER_TEMP/watch/samples" || true

      - name: Keep logs, CPU record, samples and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/iterations.log
            ${{ runner.temp }}/watch
            ${{ runner.temp }}/iterations.xcresult
          retention-days: 7
          if-no-files-found: ignore
